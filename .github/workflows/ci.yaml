# CI for product catalog
name: product-catalog-ci

on:
    pull_request:
        branches:
        - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Step up Go 1.22
              uses: actions/setup-go@v4
              with:
                go-version: 1.22

            - name: Build
              run: |
                cd src/product-catalog
                go mod download
                go build -o product-catalog-service main.go

            - name: Run unit tests
              run: |
                cd src/product-catalog
                go test ./...

    code-quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Run golangci-lint  
              uses: actions/setup-go@v4
              with:
                go-version: 1.22

            - name: Run code quality checks
              run: |
                go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
                golangci-lint run src/product-catalog/...

    docker:
        runs-on: ubuntu-latest
        
        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2
            
            - name: Log in to DockerHub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Docker push
              uses: docker/build-push-action@v6
              with:
                context: src/product-catalog
                file: src/product-catalog/Dockerfile
                push: true
                tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}

    updatek8s:  
            runs-on: ubuntu-latest
            needs: docker

            steps:
                - name: Checkout code
                  uses: actions/checkout@v7
                  with:
                    token: ${{ secrets.GITHUB_TOKEN }}
                    
                - name: update the tag in the k8s deployment file
                  run: |
                    sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml

                - name: Commit and push changes
                  run: |
                    git config --global user.name "nagababu123"
                    git config --global user.email "nagababu.rachakonda@gmail.com"
                    git add kubernetes/productcatalog/deploy.yaml
                    git commit -m "Update image tag to ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}"
                    git push origin main



